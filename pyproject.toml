# Lint and type-check settings (./test.sh lint runs both). Nothing to install:
# the scripts run wgtun/ from the checkout with macOS's own python3, stdlib only.

[tool.ruff]
required-version = "==0.17.4"   # test.sh reads it from here
target-version = "py39"         # macOS's /usr/bin/python3
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RET", "PIE"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
files = ["wgtun"]
python_version = "3.10"     # mypy's oldest supported target; the code runs on 3.9
ignore_missing_imports = true
